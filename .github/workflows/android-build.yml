name: Android build
on:
  push:
    branches: [main, 'feat/**', 'qa/**', 'stage-1/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build-only rasterizer dependencies
        run: python -m pip install --disable-pip-version-check Pillow CairoSVG
      - name: Render Stage 1 glass icons to Android PNG resources
        run: python3 tools/render_ruby_stage1_icons.py
      - name: Verify generated icon dimensions and transparency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = ["youtube","spotify","tiktok","instagram","whatsapp","google","google_play_store","configuracion","galeria","camara"]
          root = Path("app/src/main/res/drawable-nodpi")
          for name in names:
              for size in (192, 512):
                  path = root / f"ruby_{name}.png"
                  with Image.open(path) as im:
                      assert im.size == (size, size), (path, im.size)
                      assert im.mode == "RGBA", (path, im.mode)
                      assert im.getchannel("A").getextrema()[0] == 0, f"{path} must retain transparent corners"
          print("10 icons: 192px + 512px PNGs verified.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate generated Nova app filter
        run: |
          python3 tools/generate_appfilter.py
          git diff --exit-code -- app/src/main/res/xml/appfilter.xml
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jennie-ruby-debug
          path: app/build/outputs/apk/debug/app-debug.apk
