name: Android build
on:
  push:
    branches: [main, 'feat/**', 'qa/**', 'stage-1/**', 'stage-2/**']
  pull_request:
    branches: [main, 'stage-1/**']
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build-only rasterizer dependencies
        run: python -m pip install --disable-pip-version-check Pillow CairoSVG
      - name: Generate all Stage 1 PNG resources (fail-fast)
        run: python3 tools/render_ruby_stage1_icons.py
      - name: Require all ten valid 192px PNGs in drawable-nodpi
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = ["youtube","spotify","tiktok","instagram","whatsapp","google","google_play_store","configuracion","galeria","camara"]
          root = Path("app/src/main/res/drawable-nodpi")
          for name in names:
              path = root / f"ruby_{name}.png"
              if not path.is_file():
                  raise SystemExit(f"Missing generated icon: {path}")
              with Image.open(path) as im:
                  if im.size != (192, 192) or im.mode != "RGBA":
                      raise SystemExit(f"Invalid PNG: {path}: {im.size} {im.mode}")
                  if im.getpixel((0, 0))[3] != 0:
                      raise SystemExit(f"PNG corner must be transparent: {path}")
          print("PASS: all ten Stage 1 PNGs verified.")
          PY
      - name: Download pinned Google Fonts OFL families
        run: bash tools/download_widget_fonts.sh
      - name: Generate transparent widget picker previews
        run: python3 tools/generate_widget_previews.py
      - name: Validate widgets, fonts, licenses and previews
        run: python3 tools/validate_widget_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install stable personal debug signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode tools/signing/jennie-ruby-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Validate generated Nova app filter
        run: |
          python3 tools/generate_appfilter.py
          git diff --exit-code -- app/src/main/res/xml/appfilter.xml
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jennie-ruby-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload generated Stage 1 PNGs for visual review
        uses: actions/upload-artifact@v4
        with:
          name: jennie-ruby-stage1-pngs
          path: app/src/main/res/drawable-nodpi/ruby_*.png
          if-no-files-found: error
      - name: Upload real high-resolution Stage 1 contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: jennie-ruby-stage1-contact-sheet
          path: app/build/reports/jennie-ruby-stage1-contact-sheet.png
          if-no-files-found: error
      - name: Upload transparent widget picker previews (static simulations)
        uses: actions/upload-artifact@v4
        with:
          name: jennie-ruby-widget-picker-previews
          path: |
            app/src/main/res/drawable-nodpi/widget_ruby_clock_preview.png
            app/src/main/res/drawable-nodpi/widget_ruby_signature_preview.png
          if-no-files-found: error
