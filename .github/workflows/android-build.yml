name: Android build
on:
  push:
    branches: [main, 'feat/**', 'qa/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate vector icon quality
        run: python3 tools/validate_icon_vectors.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate generated Nova app filter
        run: |
          python3 tools/generate_appfilter.py
          git diff --exit-code -- app/src/main/res/xml/appfilter.xml
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jennie-ruby-debug
          path: app/build/outputs/apk/debug/app-debug.apk
