plugins { id 'com.android.application' }

android {
    namespace 'com.luisequeira612.jennieruby'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luisequeira612.jennieruby'
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName '0.9.5'
    }

    signingConfigs {
        stableDebug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'JKS'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.stableDebug }
    }
}
